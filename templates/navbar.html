<header class="navbar">
  <a href="{{ url_for('papers.index') }}" class="logo" aria-label="MyTZStudies home"><img src="{{ url_for('static', filename='tutors/tzstudies.png') }}" class="logo-img" alt="" width="38" height="38"><span class="logo-text">my<span>TZ</span>Studies<span class="brand-dot">.</span></span></a>
  <button class="nav-toggle" aria-label="Open navigation" aria-controls="navMenu" aria-expanded="false"><span class="hamburger"></span></button>
  <div class="nav-menu" id="navMenu">
    <nav class="nav-links" aria-label="Main navigation">
      <a href="{{ url_for('papers.index') }}#examSection" class="nav-link {{ 'current' if request.endpoint == 'papers.index' else '' }}">Past papers</a>
      <a href="{{ url_for('papers.answer_keys_page') }}" class="nav-link {{ 'current' if request.endpoint == 'papers.answer_keys_page' else '' }}">Answer keys</a>
      <a href="{{ url_for('tutors.tutors_page') }}" class="nav-link {{ 'current' if request.endpoint == 'tutors.tutors_page' else '' }}">Find tutors</a>
      <a href="{{ url_for('papers.about') }}" class="nav-link {{ 'current' if request.endpoint == 'papers.about' else '' }}">Our story</a>
    </nav>
    <div class="nav-auth">{% if current_user.is_authenticated %}<span class="nav-user">Hello, {{ current_user.name.split(' ')[0] }}</span><a href="{{ url_for('papers.history') }}" class="nav-link">My Papers</a><form method="post" action="{{ url_for('auth.logout') }}" class="nav-action"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="nav-link">Log out</button></form>{% else %}<a href="{{ url_for('auth.login') }}" class="nav-link">Log In</a><a href="{{ url_for('auth.signup') }}" class="btn btn-sm">Get started <span aria-hidden="true">&rarr;</span></a>{% endif %}</div>
  </div>
</header>
